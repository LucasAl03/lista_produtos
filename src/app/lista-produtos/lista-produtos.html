<div id="div-form">
    <h2>Lista Produtos</h2>

    <form id="formulario">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" name="descricao" placeholder="Descrição do Produto" [(ngModel)]="descricao_produto">

        <label for="valor_unitario">Valor Unitário</label>
        <input type="text" id="valor_unitario" name="valor_unitario" placeholder="Valor do Produto" [(ngModel)]="valor_unitario">

        <div id="div-btns">
            <button type="submit" id="btnAdd" (click)="addItem()"> Adicionar </button>
            <button type="button" id="btnLimpar" (click)="btnLimpar()"> Limpar </button>
        </div>
    </form>

    <div id="div-lista">

        <!-- @empty FUNCIONA COMO else-->
        @for(elem of listaItens; track elem.idProduto ){
            <div class="div-item"> {{elem.idProduto}} - {{elem.descricaoProduto}} - {{elem.valorUnitario}}</div>
        }@empty {
            <div class="div-item"> NENHUM ITEM ADICIONADO!!!</div>
        }
    </div>
</div>
